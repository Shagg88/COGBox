# ---- Game patches (src/layer3_gow1/game_patches.cpp) ----
# --gow1_max_fps (job 689): D3D's present-interval choice. Every path meets at 0x82250DEC with r10 = the interval:
# `li r10,3/2/1` at 0x82250DD0/D8/E0 branch there, and the default path's `lwz r10,0x50(r1)` at 0x82250DE8 falls into
# it. (The disc build's 0x8223E7B8 `li r10,2` is Canary's 60 fps patch site.)
[[entrypoint.midasm_hook]]
address = 0x82250DEC
name = "Gow1PresentInterval"
registers = ["r10"]

# Edited Coalesced.ini (launcher options, --ue3_ini_edits): Gears 1 checks the bundle at start-up and shows the
# dirty-disc error for an edited one (job 692; its hash is not in a table layer 2 can update). The check, found from
# Canary's "Disable Coalesced Hash Check" (Sowa_95, boma; disc 0x826132AC / 0x8245D088) by matching the code in TU5:
# 0x829F4F2C `li r3,1` (the check's failure result) -> 0 after it, and 0x82472E88 (function entry) returns at once.
# On only while config edits are applied (gow1_app.h); the game's own files are always checked.
[[entrypoint.midasm_hook]]
address = 0x829F4F2C
name = "Gow1CoalescedResult"
registers = ["r3"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x82472E88
name = "Gow1CoalescedSkip"
registers = []
return_on_true = true

# Skip the intro logos (--gow1_skip_logos). The start-up film player (sub around 0x8222E268) plays a table of four
# films at 0x82F9CE6C - [0] the rating screen (REPLACEME.bik -> ESRB_<lang>), [1] EpicLogo, [2] MGSLogo, [3] Startup -
# stepping its index at r31+0x44 (`addi r11,r11,1` at 0x8222E280, and 0x8222E2A8 when it passes a film switched off).
# After either step, an index of 1 or 2 becomes 3: the logos are passed the way the engine passes a film it has
# switched off. (Job 694: leaving the films out of the folder instead crashed or hung the player.)
