# Gears1-Native recompiler manifest (rexglue 0.10). Written by hand from GearsJ-Native's (2026-10-30).
# Release: disc 0.0.0.1 (title 4D5307D5, media 76E9DF5B) + Title Update 5 (notes/01). The codegen applies default.xexp itself.
# Hints are added only when the recompiler or the running game reports a problem; each says where it came from.

[project]
name = "gow1"
sdk_version = "0.10.0"
game_root = "game/tu5/patched"   # default.xex + default.xexp (the TU layout Gears 2 / Judgment use)

[entrypoint]
file_path = "game/tu5/patched/default.xex"
out_directory_path = "generated/default"
includes = []
# Gears 2's measured codegen option (its notes/60: cr_as_local -10% frame time); Judgment boots with it too.
cr_as_local = true

[entrypoint.functions]
# Job 670 codegen: "UnresolvedCall ... b <target> - target not in any function" (branches used as tail calls into code
# no function claims; Judgment's first codegen had the same kind).
0x829D88B8 = {}   # from 0x829D9514
0x82E1B200 = {}   # from 0x82D96C60
0x82ADAEB0 = {}   # from 0x82D39068

# Job 673 first boot: "[FATAL] Call to invalid or unregistered function at guest address 0x82512E08" (both renderers).
# Batch 1 (tools/funcscan.py on the TU5 image, notes/02): every entry that is reached only indirectly (a pointer in data,
# or an address built with lis+addi), lies outside every .pdata function, sits in .text/BINK, and directly follows a
# terminating instruction (blr / bctr / b / padding) - 4,429 addresses, 0x82512E08 among them. None next to an
# 'mr r8,r8' SEH marker (Judgment's rule).
