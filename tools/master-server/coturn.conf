# COGBox Coturn Configuration - STUN Only (Zero-Relay)
# Gameplay packets are 100% direct peer-to-peer. stun-only turns every TURN relay off (coturn refuses
# no-udp-relay together with no-tcp-relay), so no game traffic can pass through the server.

listening-port=3478
stun-only
no-cli
fingerprint
log-file=stdout
