# COGBox master server on the Oracle VM: signaling + lobbies (TCP 18443) and STUN only (UDP 3478). Host networking,
# so the VM's own firewall rules apply as written. No relay: game traffic never passes through this machine.
#
# Admin panel: admin (127.0.0.1:8080), docker-proxy (127.0.0.1:2375) and the master's private listener
# (127.0.0.1:8090) are loopback only. Caddy on the same host is the only way in. The firewall allows 22, 80, 443
# and UDP 3478; never open 8080, 8090 or 2375. There are no ports: entries because every service uses host networking.
# admin.env holds ADMIN_SHARED_SECRET and exists on the server only (see ../../admin-panel/RUNBOOK.md).
# pinned: the admin panel and the socket-proxy allowlist use the container names cogbox-master-<service>-1
name: cogbox-master
services:
  master-server:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: admin.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=18443
      - HOST=127.0.0.1
      - DB_PATH=/data/master.db
    volumes:
      - master-data:/data
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["turnserver", "-c", "/etc/coturn/turnserver.conf"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  admin:
    build: ../../admin-panel
    restart: unless-stopped
    network_mode: host
    # optional so a missing file never blocks the stack (compose checks every service); without the secret admin exits
    env_file:
      - path: admin.env
        required: false
    environment:
      - HOST=127.0.0.1
      - PORT=8080
      - ADMIN_DB=/data/admin.db
      - MASTER_URL=http://127.0.0.1:8090
      # the proxy only allows paths that start with an API version
      - DOCKER_URL=http://127.0.0.1:2375/v1.44
    volumes:
      - admin-data:/data
  docker-proxy:
    # The proxy image runs unprivileged: if the host socket is root:docker 660 it needs group_add with the host docker
    # group id (getent group docker). Check its logs for "socket not available" after the first start.
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    network_mode: host
    command:
      - '-allowGET=/v1\.[0-9]{1,2}/containers/cogbox-master-(master-server|coturn|caddy)-1/(json|logs)'
      - '-allowPOST=/v1\.[0-9]{1,2}/containers/cogbox-master-(master-server|coturn)-1/restart'
      - '-listenip=127.0.0.1'
      - '-allowfrom=127.0.0.1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  status-reporter:
    # Keeps one status embed up to date in Discord #server-status. Outbound only: no listening port.
    # status.env (server only, mode 600, never committed) holds DISCORD_WEBHOOK_URL and SOURCEFORGE_PROJECT.
    build: ../../status-reporter
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: status.env
        required: false
    environment:
      - MASTER_URL=http://127.0.0.1:18443   # the master's game port here (8080 on this server is the admin panel)
      - STUN_HOST=127.0.0.1
      - STUN_PORT=3478
      - GITLAB_PROJECT=shagg88/cogbox
      - GITHUB_ENABLED=true
      - GITHUB_REPO=Shagg88/COGBox
    volumes:
      - status-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
volumes:
  master-data:
  admin-data:
  caddy-data:
  caddy-config:
  status-data:
