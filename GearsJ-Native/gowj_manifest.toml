# ---- Game patches (src/layer3_gowj/game_patches.cpp, copied from Gears 3's and moved to Judgment's sites; notes/05.
# Shagg 10:11: no hack patches - settings go through the game's own ini; hooks only restore what recompiling removed
# or read timings. Each site read in disassembly beside Gears 3's - same instructions and registers) ----

# --gowj_patch_query_poll_yield (default 3): the render thread's GPU query wait loop head (`mr r4,r30`; the loop calls
# 0x82BE44F0 until done). Gears 3 0x82961994, Gears 2 0x828075BC.
[[entrypoint.midasm_hook]]
address = 0x829933B4
name = "GowjQueryPollYield"
registers = []

# --gowj_patch_gpu_wait (default 1): the D3D library's GPU-wait step (sub_82BE36C0): at the cctpl `mr r1,r1` sleep until
# our GPU side writes guest memory, then jump to the cctpm `mr r2,r2`. Gears 3 0x82AF98EC -> 0x82AF991C.
[[entrypoint.midasm_hook]]
address = 0x82BE36D4
name = "GowjGpuWaitStep"
registers = []
jump_address_on_true = 0x82BE3704

# --gowj_tick_log (read-only timing; the frame limit itself is an ini edit): after GetMaxTickRate's
# `lfs f1,0x4CC(r3)` (MaxSmoothedFrameRate). Gears 3 0x8253D9B0.
[[entrypoint.midasm_hook]]
address = 0x8255E220
name = "GowjMaxTickRate"
registers = ["f1"]
after_instruction = true
