# GearsJ-Native recompiler manifest (rexglue 0.10). Started from `rexglue init` (job 002b, 2026-10-24).
# Release: disc 0.0.0.3 (media 3528321A) + Title Update 4 (notes/01, notes/03). The codegen applies default.xexp itself.
# Hints are added only when the recompiler or the running game reports a problem; each says where it came from.

[project]
name = "gowj"
sdk_version = "0.10.0"
game_root = "game/tu4/patched"   # default.xex + default.xexp (job 001; Gears 2's TU6 layout, its notes/63)

[entrypoint]
file_path = "game/tu4/patched/default.xex"
out_directory_path = "generated/default"
includes = []
# Gears 2's measured codegen option (its notes/60, job 223: cr_as_local -10% frame time). non_volatile_as_local stays
# off for the first boots (unwinding and setjmp read those registers from the context); try it once Judgment plays.
cr_as_local = true

[entrypoint.functions]
