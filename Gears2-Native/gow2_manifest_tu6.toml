# Gears2-Native recompiler manifest for TITLE UPDATE 6 (0.0.6.5), notes/63. Made from gow2_manifest.toml (the disc,
# 0.0.0.5) by mapping every address with tools/tu_remap.py (job 241 image dumps) and checking each hook site's
# instructions; built with tools\build.ps1 -Tu6. Function hints the matcher could not place are commented out and
# re-found by the scanners after the first codegen.
# Gears2-Native recompiler manifest (rexglue). Started from `rexglue init` output (job 007).
# Hints below are added only when the recompiler or the running game reports a problem; each one says where it came from.

[project]
name = "gow2"
sdk_version = "0.10.0"
game_root = "game/tu6/patched"   # TU6 (notes/63): default.xex + default.xexp; the codegen applies the patch

[entrypoint]
file_path = "game/tu6/patched/default.xex"
out_directory_path = "generated/tu6"
includes = []
# CPU step 2 (notes/60, jobs 219-225; job 223: non_argument_as_local crashes at boot, cr_as_local -10%, the rest ~0): keep these PowerPC registers in host locals inside each function instead of the
# shared context in memory, so the compiler can hold them in host registers. The XenonRecomp-family options; the
# riskier two (skip_lr, non_volatile_as_local: unwinding and setjmp read them from the context) stay off for now.
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = true   # job 223: alone ch10 12.47 vs 13.82 ms (-10%); job 225 checks it (shots, 2x, capped)
non_argument_as_local = false

